<script>
(function () {
'use strict';

const APP_BUILD = 2;                     // zusammen mit CACHE = 'sef-lernapp-v2' in sw.js erhöhen
const APP_VERSION = `${APP_BUILD} · 24.11.2026`;

/* =====================================================================
   Hilfsfunktionen
   ===================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const LETTERS = ['a', 'b', 'c', 'd', 'e', 'f'];
const fmtDate = t => new Date(t).toLocaleDateString('de-AT', { day: '2-digit', month: '2-digit', year: 'numeric' });
const fmtTime = t => new Date(t).toLocaleTimeString('de-AT', { hour: '2-digit', minute: '2-digit' });
const fmtDur = ms => { const s = Math.max(1, Math.round(ms / 1000)), m = Math.floor(s / 60); return m ? `${m} min ${String(s % 60).padStart(2, '0')} s` : `${s} s`; };

/* Icons (Lucide, MIT) */
const ICON = {
  scale: '<path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/>',
  siren: '<path d="M7 18v-6a5 5 0 1 1 10 0v6"/><path d="M5 21a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-1a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2z"/><path d="M21 12h1"/><path d="M18.5 4.5 18 5"/><path d="M2 12h1"/><path d="M12 2v1"/><path d="m4.929 4.929.707.707"/><path d="M12 12v6"/>',
  gauge: '<path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/>',
  alert: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  wrench: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  chevron: '<path d="m9 18 6-6-6-6"/>',
  left: '<path d="m15 18-6-6 6-6"/>',
  bookmark: '<path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  redo: '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
  shuffle: '<path d="m18 14 4 4-4 4"/><path d="m18 2 4 4-4 4"/><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="M2 6h1.4c1.3 0 2.5.6 3.3 1.7l.6.8"/><path d="M22 18h-6.1c-1.3 0-2.5-.6-3.3-1.7l-.6-.8"/>',
  play: '<path d="M6 3l14 9-14 9V3z"/>',
  list: '<path d="M3 12h.01"/><path d="M3 18h.01"/><path d="M3 6h.01"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M8 6h13"/>',
  info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  clipboard: '<rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/>',
  trophy: '<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>',
  trash: '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
  eye: '<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>'
};
const ico = (name, cls = 'w-5 h-5', sw = 2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" class="${cls}" aria-hidden="true">${ICON[name]}</svg>`;
const icoFill = (name, cls = 'w-5 h-5') => `<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${cls}" aria-hidden="true">${ICON[name]}</svg>`;

/* =====================================================================
   Daten
   ===================================================================== */
const KATS = SEF_KATEGORIEN;
const FRAGEN = SEF_FRAGEN;
const BY_ID = Object.fromEntries(FRAGEN.map(q => [q.id, q]));
const KAT = Object.fromEntries(KATS.map(k => [k.id, k]));
const NUM = id => id.replace(/^[a-z]+/, '');                     // Nummer der Frage im Kurs
const UNBESTAETIGT = FRAGEN.filter(q => q.v === 0);

/* Farben je Kategorie (vollständige Klassen – sonst findet Tailwind sie nicht) */
const KSTYLE = {
  avr: { icon: 'scale',  bg: 'bg-sky-100 text-sky-700 dark:bg-sky-400/15 dark:text-sky-300',             bar: 'bg-sky-500',     chip: 'bg-sky-100 text-sky-800 dark:bg-sky-400/15 dark:text-sky-300' },
  svr: { icon: 'siren',  bg: 'bg-blue-100 text-blue-700 dark:bg-blue-400/15 dark:text-blue-300',         bar: 'bg-blue-500',    chip: 'bg-blue-100 text-blue-800 dark:bg-blue-400/15 dark:text-blue-300' },
  fp:  { icon: 'gauge',  bg: 'bg-amber-100 text-amber-700 dark:bg-amber-400/15 dark:text-amber-300',     bar: 'bg-amber-500',   chip: 'bg-amber-100 text-amber-800 dark:bg-amber-400/15 dark:text-amber-300' },
  gp:  { icon: 'alert',  bg: 'bg-violet-100 text-violet-700 dark:bg-violet-400/15 dark:text-violet-300', bar: 'bg-violet-500',  chip: 'bg-violet-100 text-violet-800 dark:bg-violet-400/15 dark:text-violet-300' },
  fk:  { icon: 'wrench', bg: 'bg-emerald-100 text-emerald-700 dark:bg-emerald-400/15 dark:text-emerald-300', bar: 'bg-emerald-500', chip: 'bg-emerald-100 text-emerald-800 dark:bg-emerald-400/15 dark:text-emerald-300' }
};

/* Bausteine */
const PANEL = 'rounded-[1.75rem] bg-white dark:bg-zinc-900 shadow-sm ring-1 ring-black/5 dark:ring-white/5';
const PRESS = 'active:scale-[.98] transition-transform';
const BTN_PRIMARY = 'w-full h-12 rounded-full bg-red-600 text-white font-semibold shadow-sm shadow-red-900/20 active:bg-red-700 disabled:opacity-40 disabled:shadow-none transition';
const BTN_SECOND = 'w-full h-12 rounded-full bg-zinc-200/80 text-zinc-800 dark:bg-zinc-800 dark:text-zinc-100 font-semibold active:bg-zinc-300 dark:active:bg-zinc-700 disabled:opacity-40 transition';
const sectionTitle = (t, extra = '') => `<div class="flex items-center justify-between px-2 pt-3 pb-0.5"><h2 class="text-[13px] font-bold uppercase tracking-wider text-zinc-500 dark:text-zinc-400">${t}</h2>${extra}</div>`;

/* =====================================================================
   Zustand
   ===================================================================== */
const SICHER = 2;   // so oft hintereinander richtig → „sicher“
const state = {
  tab: LS.get('sef_tab', 'lernen'),
  stats: LS.get('sef_stats_v1', {}),     // id → { n: gesehen, ok: richtig, s: Serie, w: falsch, last: 1|0, t: Zeit }
  marks: LS.get('sef_marks_v1', []),     // markierte Fragen
  exams: LS.get('sef_exams_v1', []),     // letzte Prüfungen
  set: Object.assign({ shuffle: true, round: 10, examN: 30, reveal: true }, LS.get('sef_settings_v1', {})),
  filter: 'alle',                        // Fragen-Tab: Kategorie / markiert / unbestätigt
  search: '',
  revealed: new Set()
};
if (!['lernen', 'pruefung', 'fragen'].includes(state.tab)) state.tab = 'lernen';
const saveSet = () => LS.set('sef_settings_v1', state.set);

function status(id) {
  const s = state.stats[id];
  if (!s || !s.n) return 'neu';
  return s.s >= SICHER ? 'sicher' : 'ueben';
}
const isWrong = id => { const s = state.stats[id]; return !!(s && s.last === 0); };
const isMarked = id => state.marks.includes(id);
function counts(list) {
  const c = { neu: 0, ueben: 0, sicher: 0, falsch: 0, total: list.length };
  list.forEach(q => { c[status(q.id)]++; if (isWrong(q.id)) c.falsch++; });
  return c;
}
function record(id, ok) {
  const s = state.stats[id] || { n: 0, ok: 0, s: 0, w: 0 };
  s.n++;
  if (ok) { s.ok++; s.s++; } else { s.w++; s.s = 0; }
  s.last = ok ? 1 : 0; s.t = Date.now();
  state.stats[id] = s;
  LS.set('sef_stats_v1', state.stats);
}
function toggleMark(id) {
  const i = state.marks.indexOf(id);
  if (i >= 0) state.marks.splice(i, 1); else state.marks.push(id);
  LS.set('sef_marks_v1', state.marks);
  return i < 0;
}

/* Bewertung: richtig nur, wenn genau alle richtigen Antworten gewählt sind */
function grade(q, sel) {
  const R = new Set(q.r); let hit = 0, wrong = 0;
  sel.forEach(i => R.has(i) ? hit++ : wrong++);
  if (hit === R.size && wrong === 0) return 'ok';
  return hit > 0 ? 'part' : 'wrong';
}

/* =====================================================================
   Lernrunden & Prüfung zusammenstellen
   ===================================================================== */
function prio(q) {
  const s = state.stats[q.id];
  if (!s || !s.n) return 2;            // neu
  if (s.last === 0) return 0;          // zuletzt falsch
  if (s.s < SICHER) return 1;          // noch üben
  return 3;                            // sicher → nur zur Wiederholung
}
function pickLearn(list, n) {
  const arr = shuffle(list.slice()).sort((a, b) => prio(a) - prio(b) || ((state.stats[a.id] || {}).t || 0) - ((state.stats[b.id] || {}).t || 0));
  return shuffle(arr.slice(0, n));
}
function pickExam(n) {
  if (n >= FRAGEN.length) return shuffle(FRAGEN.map(q => q.id));
  const total = FRAGEN.length;
  /* anteilig nach Kategoriegröße, aber aus jeder Kategorie mindestens 1 Frage */
  const parts = KATS.map(k => { const list = FRAGEN.filter(q => q.k === k.id); const exact = n * list.length / total; return { list, take: Math.max(1, Math.floor(exact)), rest: exact % 1 }; });
  let diff = n - parts.reduce((s, p) => s + p.take, 0);
  parts.slice().sort((a, b) => b.rest - a.rest).forEach(p => { if (diff > 0 && p.take < p.list.length) { p.take++; diff--; } });
  while (diff < 0) { const big = parts.reduce((a, b) => (b.take > a.take ? b : a)); big.take--; diff++; }
  return shuffle(parts.flatMap(p => shuffle(p.list.slice()).slice(0, p.take).map(q => q.id)));
}

let session = null;
function newSession(mode, title, ids, meta = {}) {
  const order = {};
  ids.forEach(id => { const idx = BY_ID[id].a.map((_, i) => i); order[id] = state.set.shuffle ? shuffle(idx) : idx; });
  return { mode, title, ids, i: 0, order, sel: {}, checked: {}, res: {}, start: Date.now(), done: false, meta };
}
function startSession(s) {
  session = s;
  if (stack[stack.length - 1] === 'sheet') {        // Sheet wird durch das Quiz ersetzt (gleicher Verlaufseintrag)
    stack[stack.length - 1] = 'quiz'; hideSheet();
  } else pushLayer('quiz');
  showQuiz();
}
function startLearn(list, title, n) {
  if (!list.length) { toast('Keine passenden Fragen vorhanden.'); return; }
  const ids = pickLearn(list, Math.min(n || state.set.round, list.length)).map(q => q.id);
  startSession(newSession('learn', title, ids, { list: list.map(q => q.id), n }));
}
function startInOrder(list, title) {
  startSession(newSession('learn', title, list.map(q => q.id), { inOrder: true }));
}
function startExam() {
  const n = state.set.examN === 'alle' ? FRAGEN.length : state.set.examN;
  startSession(newSession('exam', 'Prüfungssimulation', pickExam(n)));
}

/* =====================================================================
   Navigation: Zurück-Taste / -Geste schließt Quiz, Sheets und Dialoge
   ===================================================================== */
const stack = [];
let pendingPop = 0;
function pushLayer(name) { stack.push(name); try { history.pushState({ sef: stack.length }, ''); } catch (e) {} }
function popLayers(k = 1) { k = Math.min(k, stack.length); if (!k) return; pendingPop += k; history.go(-k); }
window.addEventListener('popstate', () => {
  const user = !pendingPop; let k = pendingPop || 1; pendingPop = 0;
  if (user && stack[stack.length - 1] === 'quiz' && examRunning()) {
    try { history.pushState({ sef: stack.length }, ''); } catch (e) {}
    askAbortExam(); return;
  }
  while (k-- > 0 && stack.length) closeLayer(stack.pop());
});
function closeLayer(name) {
  if (name === 'dlg') hideDlg();
  else if (name === 'sheet') hideSheet();
  else if (name === 'quiz') hideQuiz();
}
const examRunning = () => session && session.mode === 'exam' && !session.done && Object.keys(session.sel).some(id => session.sel[id].length);
function askAbortExam() {
  confirmDlg({ title: 'Prüfung abbrechen?', text: 'Deine bisherigen Antworten dieser Prüfung werden nicht gewertet.', ok: 'Abbrechen', cancel: 'Weitermachen', danger: true,
    onOk: () => popLayers(2) });
}

/* =====================================================================
   Tabs
   ===================================================================== */
const TAB_TITLE = { lernen: 'Lernen', pruefung: 'Prüfung', fragen: 'Fragenkatalog' };
const TAB_IDX = { lernen: 0, pruefung: 1, fragen: 2 };
function renderChrome() {
  $('#hdrTitle').textContent = TAB_TITLE[state.tab];
  document.querySelectorAll('#tabbar [data-tab]').forEach(btn => {
    const on = btn.dataset.tab === state.tab;
    btn.setAttribute('aria-selected', on ? 'true' : 'false');
    btn.className = `relative flex flex-col items-center gap-1 pt-2 pb-2 transition-colors duration-300 ${on ? 'text-red-700 dark:text-red-300' : 'text-zinc-500 dark:text-zinc-400'}`;
  });
  $('#tabInd').style.transform = `translateX(${TAB_IDX[state.tab] * 100}%)`;
}
function switchTab(t) {
  if (t === state.tab) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  state.tab = t; LS.set('sef_tab', t);
  window.scrollTo(0, 0);
  render();
}
function render() {
  renderChrome();
  const v = $('#view');
  if (state.tab === 'lernen') v.innerHTML = renderLernen();
  else if (state.tab === 'pruefung') v.innerHTML = renderPruefung();
  else {
    v.innerHTML = renderFragenShell(); renderFragenList();
    const chip = v.querySelector(`[data-act="filter"][data-f="${state.filter}"]`);
    if (chip && chip.parentElement) chip.parentElement.scrollLeft = Math.max(0, chip.offsetLeft - 24);
  }
  v.classList.remove('fade-in'); void v.offsetWidth; v.classList.add('fade-in');
}

/* ---------- Gestapelter Fortschrittsbalken ---------- */
function stackBar(c, light) {
  const w = x => `${c.total ? x / c.total * 100 : 0}%`;
  if (light) return `<div class="flex h-2.5 rounded-full overflow-hidden bg-white/20">
      <span class="bar-anim h-full bg-white" style="width:${w(c.sicher)}"></span><span class="bar-anim h-full bg-white/50" style="width:${w(c.ueben)}"></span></div>`;
  return `<div class="flex h-2 rounded-full overflow-hidden bg-zinc-200/80 dark:bg-zinc-800">
      <span class="bar-anim h-full bg-emerald-500" style="width:${w(c.sicher)}"></span><span class="bar-anim h-full bg-amber-400" style="width:${w(c.ueben)}"></span></div>`;
}

/* =====================================================================
   Tab „Lernen“
   ===================================================================== */
function renderLernen() {
  const c = counts(FRAGEN), p = pct(c.sicher, c.total);
  const marked = state.marks.length;
  const allDone = c.sicher === c.total;
  const hero = `<section class="rounded-[2rem] p-5 text-white bg-gradient-to-br from-red-600 via-red-700 to-red-900 shadow-lg shadow-red-900/20">
    <div class="flex items-start justify-between gap-3">
      <div>
        <p class="text-sm font-medium text-white/80">Dein Lernstand</p>
        <p class="mt-1 text-5xl font-bold tracking-tight tabular">${p}<span class="text-2xl font-semibold"> %</span></p>
      </div>
      <p class="pt-1 text-right text-sm leading-snug text-white/85"><b class="text-white tabular">${c.sicher}</b> von <span class="tabular">${c.total}</span> Fragen<br>sicher beantwortet</p>
    </div>
    <div class="mt-4">${stackBar(c, true)}</div>
    <div class="mt-2.5 flex gap-4 text-xs text-white/85">
      <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-white"></span>sicher <b class="tabular">${c.sicher}</b></span>
      <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-white/50"></span>üben <b class="tabular">${c.ueben}</b></span>
      <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-white/20 ring-1 ring-white/40"></span>neu <b class="tabular">${c.neu}</b></span>

        </div>

  </div>`;
}
function quizScrollTop() { const s = $('#quizScroll'); if (s) s.scrollTop = 0; }

function selectOpt(oi) {
  const q = curQ(), id = q.id;
  if (session.mode === 'learn' && session.checked[id]) return;
  let sel = (session.sel[id] || []).slice();
  if (q.m) sel = sel.includes(oi) ? sel.filter(x => x !== oi) : sel.concat(oi);
  else sel = sel.includes(oi) && session.mode === 'exam' ? [] : [oi];
  session.sel[id] = sel;
  const y = $('#quizScroll') ? $('#quizScroll').scrollTop : 0;
  renderQuiz();
  if ($('#quizScroll')) $('#quizScroll').scrollTop = y;
}
function checkAnswer() {
  const q = curQ(), sel = session.sel[q.id] || [];
  if (!sel.length) return;
  const r = grade(q, sel);
  session.checked[q.id] = true; session.res[q.id] = r;
  record(q.id, r === 'ok');
  if (navigator.vibrate && r !== 'ok') { try { navigator.vibrate(40); } catch (e) {} }
  renderQuiz();
  const s = $('#quizScroll'); if (s) s.scrollTo({ top: s.scrollHeight, behavior: 'smooth' });
}
function nextQ() {
  if (session.i < session.ids.length - 1) { session.i++; renderQuiz(); quizScrollTop(); return; }
  if (session.mode === 'exam') { finishExam(); return; }
  session.done = true; renderQuiz();
}
function prevQ() { if (session.i > 0) { session.i--; renderQuiz(); quizScrollTop(); } }
function finishExam(force) {
  const open = session.ids.filter(id => !(session.sel[id] || []).length).length;
  if (open && !force) {
    confirmDlg({ title: 'Prüfung abgeben?', text: `${open} ${open === 1 ? 'Frage ist' : 'Fragen sind'} noch unbeantwortet und ${open === 1 ? 'zählt' : 'zählen'} als falsch.`, ok: 'Abgeben', cancel: 'Zurück',
      onOk: () => { popLayers(1); setTimeout(() => finishExam(true), 0); } });
    return;
  }
  session.ids.forEach(id => { const q = BY_ID[id], sel = session.sel[id] || []; session.res[id] = sel.length ? grade(q, sel) : 'wrong'; record(id, session.res[id] === 'ok'); });
  const ok = session.ids.filter(id => session.res[id] === 'ok').length;
  const entry = { t: Date.now(), d: Date.now() - session.start, n: session.ids.length, ok, ids: session.ids, sel: session.sel, res: session.res };
  state.exams.unshift(entry); state.exams = state.exams.slice(0, 20);
  LS.set('sef_exams_v1', state.exams);
  session.done = true; session.entry = entry;
  renderQuiz(); quizScrollTop();
}

/* ---------- Auswertung ---------- */
function ringChart(p) {
  const r = 52, c = 2 * Math.PI * r, col = p >= 80 ? 'text-emerald-500' : p >= 60 ? 'text-amber-500' : 'text-rose-500';
  return `<div class="relative w-40 h-40 mx-auto">
    <svg viewBox="0 0 120 120" class="w-full h-full -rotate-90"><circle cx="60" cy="60" r="${r}" fill="none" stroke-width="11" class="stroke-zinc-200 dark:stroke-zinc-800"/>
    <circle id="ringFg" cx="60" cy="60" r="${r}" fill="none" stroke-width="11" stroke-linecap="round" stroke="currentColor" class="ring-anim ${col}" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-off="${c * (1 - p / 100)}"/></svg>
    <div class="absolute inset-0 grid place-items-center"><p class="text-4xl font-bold tabular">${p}<span class="text-lg font-semibold"> %</span></p></div>
  </div>`;
}
function resultList(ids, sel, res, onlyWrong) {
  const list = ids.filter(id => !onlyWrong || res[id] !== 'ok');
  if (!list.length) return '';
  return list.map(id => {
    const q = BY_ID[id], my = sel[id] || [], r = res[id];
    const badge = { ok: ['richtig', 'bg-emerald-100 text-emerald-800 dark:bg-emerald-400/15 dark:text-emerald-300'], part: ['teilweise', 'bg-amber-100 text-amber-800 dark:bg-amber-400/15 dark:text-amber-300'], wrong: ['falsch', 'bg-rose-100 text-rose-800 dark:bg-rose-400/15 dark:text-rose-300'] }[r];
    return `<article class="${PANEL} p-4">
      <div class="flex items-center gap-2"><span class="text-[11px] font-semibold px-2 py-0.5 rounded-full ${KSTYLE[q.k].chip}">${esc(KAT[q.k].kurz)} · ${NUM(id)}</span>
        <span class="text-[11px] font-bold px-2 py-0.5 rounded-full ${badge[1]}">${my.length ? badge[0] : 'nicht beantwortet'}</span></div>
      <h3 class="mt-2 font-semibold leading-snug">${esc(q.f)}</h3>
      <ul class="mt-2.5 space-y-1.5">${q.a.map((t, i) => {
        const ok = q.r.includes(i), on = my.includes(i);
        const cls = ok ? 'text-emerald-800 dark:text-emerald-300 font-medium' : on ? 'text-rose-700 dark:text-rose-300 line-through decoration-rose-400/60' : 'text-zinc-400 dark:text-zinc-500';
        const dot = ok ? `<span class="shrink-0 mt-0.5 w-5 h-5 rounded-full grid place-items-center bg-emerald-500 text-white">${ico('check', 'w-3.5 h-3.5', 3)}</span>`
          : on ? `<span class="shrink-0 mt-0.5 w-5 h-5 rounded-full grid place-items-center bg-rose-500 text-white">${ico('x', 'w-3.5 h-3.5', 3)}</span>`
          : '<span class="shrink-0 mt-0.5 w-5 h-5 rounded-full bg-zinc-100 dark:bg-zinc-800"></span>';
        return `<li class="flex gap-2.5 text-[15px] leading-snug ${cls}">${dot}<span>${esc(t)}${on && ok ? ' <span class="text-xs font-semibold opacity-70">(gewählt)</span>' : ''}</span></li>`;
      }).join('')}</ul>
      ${q.v === 0 ? unconfirmedBox(q, 'mt-3') : ''}
    </article>`;
  }).join('');
}
function renderSummary() {
  const exam = session.mode === 'exam';
  const ids = session.ids, res = session.res;
  const ok = ids.filter(id => res[id] === 'ok').length, part = ids.filter(id => res[id] === 'part').length, wrong = ids.length - ok - part;
  const p = pct(ok, ids.length);
  const msg = p === 100 ? 'Perfekt – alles richtig!' : p >= 80 ? 'Sehr gut!' : p >= 60 ? 'Gut – da geht noch was.' : 'Dranbleiben – Übung macht den Meister.';
  const wrongIds = ids.filter(id => res[id] !== 'ok');

  let breakdown = '';
  if (exam) {

      return `<div><div class="flex justify-between text-sm"><span class="font-semibold">${esc(k.kurz)}</span><span class="tabular text-zinc-500 dark:text-zinc-400">${kok}/${kids.length}</span></div>
        <div class="mt-1.5 h-2 rounded-full bg-zinc-200/80 dark:bg-zinc-800 overflow-hidden"><div class="h-full rounded-full ${KSTYLE[k.id].bar}" style="width:${pct(kok, kids.length)}%"></div></div></div>`;
    }).join('')}</section>`;
  }

  $('#quiz').innerHTML = `<div class="h-full max-w-md mx-auto flex flex-col">
    <div class="pt-safe shrink-0">
      <div class="flex items-center gap-2 px-3 h-14">
        <button data-act="quizClose" class="shrink-0 w-11 h-11 rounded-full grid place-items-center bg-white dark:bg-zinc-900 ring-1 ring-black/5 dark:ring-white/10 text-zinc-600 dark:text-zinc-300 active:scale-95 transition" aria-label="Schließen">${ico('x')}</button>
        <div class="flex-1 min-w-0 text-center"><p class="text-sm font-bold truncate">${exam ? 'Prüfung abgegeben' : 'Runde beendet'}</p><p class="text-xs text-zinc-500 dark:text-zinc-400">${esc(session.title)}</p></div>
        <span class="w-11"></span>
      </div>
    </div>
    <div id="quizScroll" class="flex-1 overflow-y-auto overscroll-contain px-3 pt-3 pb-4 space-y-3">
      <section class="${PANEL} p-5 text-center fade-in">
        ${ringChart(p)}
        <p class="mt-3 text-xl font-bold">${msg}</p>
        <p class="mt-1 text-sm text-zinc-500 dark:text-zinc-400 tabular">${ok} von ${ids.length} richtig${exam ? ` · ${fmtDur(session.entry ? session.entry.d : Date.now() - session.start)}` : ''}</p>
        <div class="mt-4 grid grid-cols-3 gap-2">
          ${miniStat(ok, 'richtig', 'text-emerald-600 dark:text-emerald-400')}${miniStat(part, 'teilweise', 'text-amber-600 dark:text-amber-400')}${miniStat(wrong, 'falsch', 'text-rose-600 dark:text-rose-400')}
        </div>
      </section>
      ${breakdown}
      ${wrongIds.length ? sectionTitle(exam ? 'Fehler ansehen' : 'Nicht richtig beantwortet') + resultList(ids, session.sel, res, true) : ''}
    </div>
    <div class="shrink-0 px-3 pt-3 pb-safe-3 bg-zinc-100/90 dark:bg-zinc-950/90 backdrop-blur-xl border-t border-zinc-200/70 dark:border-zinc-800 space-y-2">
      ${wrongIds.length ? `<button data-act="repeatWrong" class="${BTN_PRIMARY} flex items-center justify-center gap-2">${ico('redo')} ${wrongIds.length === 1 ? 'Diese Frage' : `Diese ${wrongIds.length} Fragen`} wiederholen</button>` : ''}
      <div class="flex gap-2">
        ${exam ? `<button data-act="examAgain" class="${BTN_SECOND}">Neue Prüfung</button>` : `<button data-act="learnAgain" class="${BTN_SECOND}">Neue Runde</button>`}
        <button data-act="quizClose" class="${BTN_SECOND}">Fertig</button>
      </div>
    </div>
  </div>`;
  requestAnimationFrame(() => requestAnimationFrame(() => { const r = $('#ringFg'); if (r) r.style.strokeDashoffset = r.dataset.off; }));

/* Einstellungen */
const themePref = () => { const t = LS.get('sef_theme', null); return t === 'light' || t === 'dark' ? t : 'auto'; };
const systemDark = () => window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
function applyTheme() {
  const p = themePref(), dark = p === 'auto' ? systemDark() : p === 'dark';
  document.documentElement.classList.toggle('dark', dark);
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', dark ? '#09090b' : '#f4f4f5');
}
function pill(act, opts, cur) {
  return `<div class="flex p-1 gap-1 rounded-full bg-zinc-200/70 dark:bg-zinc-800">${opts.map(([v, l]) => `<button data-act="${act}" data-v="${v}" class="flex-1 h-10 rounded-full text-sm font-semibold transition ${String(v) === String(cur) ? 'bg-white text-zinc-900 shadow-sm dark:bg-zinc-600 dark:text-white' : 'text-zinc-500 dark:text-zinc-400'}">${l}</button>`).join('')}</div>`;
}
function settingsHtml() {

    <button data-act="shuffleToggle" class="mt-5 w-full flex items-center gap-3 rounded-2xl bg-white dark:bg-zinc-800/70 ring-1 ring-black/5 dark:ring-white/5 px-4 py-3.5 text-left">
      <span class="shrink-0 text-zinc-500 dark:text-zinc-400">${ico('shuffle')}</span>

      <span class="w-11 h-6 rounded-full p-0.5 transition-colors ${state.set.shuffle ? 'bg-emerald-500' : 'bg-zinc-300 dark:bg-zinc-700'}"><span class="block w-5 h-5 rounded-full bg-white shadow transition-transform ${state.set.shuffle ? 'translate-x-5' : ''}"></span></span>

/* =====================================================================
   Klicks (ein zentraler Handler)
   ===================================================================== */
document.addEventListener('click', e => {
  const tabBtn = e.target.closest('[data-tab]');
  if (tabBtn) { switchTab(tabBtn.dataset.tab); return; }
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act, k = el.dataset.k;
  switch (a) {
    case 'learnAll': startLearn(FRAGEN, 'Lernrunde'); break;
    case 'learnWrong': startLearn(FRAGEN.filter(q => isWrong(q.id)), 'Falsche wiederholen', 999); break;
    case 'learnMarked': startLearn(FRAGEN.filter(q => isMarked(q.id)), 'Markierte Fragen', 999); break;
    case 'cat': openCatSheet(k); break;
    case 'catLearn': startLearn(FRAGEN.filter(q => q.k === k), KAT[k].kurz); break;
    case 'catOrder': startInOrder(FRAGEN.filter(q => q.k === k), KAT[k].kurz); break;
    case 'catWrong': startLearn(FRAGEN.filter(q => q.k === k && isWrong(q.id)), `${KAT[k].kurz} – Falsche`, 999); break;
    case 'catBrowse': state.filter = k; state.search = ''; state.tab = 'fragen'; LS.set('sef_tab', 'fragen'); renderAfterPop = true; popLayers(1); break;
    case 'unconfirmedInfo': unconfirmedInfo(); break;
    case 'showUnconfirmed': state.filter = 'unbestaetigt'; state.search = ''; state.tab = 'fragen'; LS.set('sef_tab', 'fragen'); renderAfterPop = true; popLayers(1); break;
    case 'examN': state.set.examN = el.dataset.n === 'alle' ? 'alle' : +el.dataset.n; saveSet(); render(); break;
    case 'examStart': startExam(); break;
    case 'examShow': openExamSheet(+el.dataset.i); break;
    case 'filter': state.filter = el.dataset.f; render(); break;
    case 'reveal': state.set.reveal = !state.set.reveal; state.revealed.clear(); saveSet(); render(); break;
    case 'revealOne': state.revealed.add(el.dataset.id); renderFragenList(); break;
    case 'markList': { const on = toggleMark(el.dataset.id); if (state.filter === 'markiert') render(); else renderFragenList(); toast(on ? 'Frage markiert' : 'Markierung entfernt', 1600); break; }
    /* Quiz */
    case 'opt': selectOpt(+el.dataset.o); break;
    case 'check': checkAnswer(); break;
    case 'next': nextQ(); break;
    case 'prev': prevQ(); break;
    case 'finish': finishExam(); break;
    case 'mark': { const on = toggleMark(curQ().id); const y = $('#quizScroll').scrollTop; renderQuiz(); $('#quizScroll').scrollTop = y; toast(on ? 'Frage markiert' : 'Markierung entfernt', 1600); break; }
    case 'quizClose': if (examRunning()) askAbortExam(); else popLayers(1); break;
    case 'repeatWrong': {
      const ids = session.ids.filter(id => session.res[id] !== 'ok');
      session = newSession('learn', 'Fehler wiederholen', shuffle(ids.slice())); renderQuiz(); quizScrollTop(); break;
    }
    case 'learnAgain': {
      const m = session.meta;
      const list = m.list ? m.list.map(id => BY_ID[id]) : session.ids.map(id => BY_ID[id]);
      session = m.inOrder ? newSession('learn', session.title, session.ids, m) : newSession('learn', session.title, pickLearn(list, Math.min(m.n || state.set.round, list.length)).map(q => q.id), m);
      renderQuiz(); quizScrollTop(); break;
    }
    case 'examAgain': session = newSession('exam', 'Prüfungssimulation', pickExam(state.set.examN === 'alle' ? FRAGEN.length : state.set.examN)); renderQuiz(); quizScrollTop(); break;
    /* Sheets & Dialog */
    case 'sheetClose': popLayers(1); break;
    case 'settings': openSettings(); break;
    case 'theme': if (el.dataset.v === 'auto') LS.del('sef_theme'); else LS.set('sef_theme', el.dataset.v); applyTheme(); openSheet(settingsHtml()); break;
    case 'round': state.set.round = +el.dataset.v; saveSet(); openSheet(settingsHtml()); render(); break;
    case 'shuffleToggle': state.set.shuffle = !state.set.shuffle; saveSet(); openSheet(settingsHtml()); break;
    case 'reset': confirmDlg({ title: 'Lernfortschritt zurücksetzen?', text: 'Alle Antworten, Markierungen und Prüfungsergebnisse auf diesem Gerät werden gelöscht.', ok: 'Zurücksetzen', danger: true,
      onOk: () => { state.stats = {}; state.marks = []; state.exams = []; ['sef_stats_v1', 'sef_marks_v1', 'sef_exams_v1'].forEach(LS.del); popLayers(2); render(); toast('Lernfortschritt zurückgesetzt'); } }); break;
    case 'dlgOk': { const f = dlgCtx && dlgCtx.onOk; if (f) f(); else popLayers(1); break; }
    case 'dlgCancel': popLayers(1); break;
  }
});
/* Nach dem Schließen des Sheets mit Tab-Wechsel neu zeichnen */
let renderAfterPop = false;
window.addEventListener('popstate', () => { if (renderAfterPop && !stack.length) { renderAfterPop = false; window.scrollTo(0, 0); render(); } });

document.addEventListener('input', e => {
  if (e.target.id === 'search') { state.search = e.target.value; renderFragenList(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'search') e.target.blur();
});

/* =====================================================================
   Start
   ===================================================================== */
try { history.scrollRestoration = 'manual'; } catch (e) {}
applyTheme();
if (window.matchMedia) {
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const onChange = () => { if (themePref() === 'auto') applyTheme(); };
  mq.addEventListener ? mq.addEventListener('change', onChange) : mq.addListener(onChange);
}
render();

/* Service Worker: App startet auch offline; neue Versionen werden automatisch geladen
   (aber nie mitten in einer Lernrunde oder Prüfung – dann erst nach dem Schließen). */
let reloadPending = false, reloading = false;
function reloadNow() { if (!reloading) { reloading = true; location.reload(); } }
function checkAppUpdate() {
  if (!('serviceWorker' in navigator) || !navigator.serviceWorker.getRegistration) return;
  navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {});
}
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('message', e => {
    if (!e.data || !e.data.cache || e.data.cache === `sef-lernapp-v${APP_BUILD}`) return;
    if (session || dlgCtx) reloadPending = true; else reloadNow();
  });
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hadController && navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage('version');
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (reloadPending && !session && !dlgCtx) reloadNow(); else checkAppUpdate();
  });
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch(() => {}); });
}
})();
</script>
